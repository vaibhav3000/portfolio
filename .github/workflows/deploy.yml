name: Deploy to GitHub Pages

# Pull requests build and check the static export; pushes to main also publish
# it to the gh-pages branch that GitHub Pages serves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Served from github.io/<repo>/ by default, or from the domain root once
      # the repository variable PAGES_CUSTOM_DOMAIN is set.
      - name: Resolve site URL and base path
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "NEXT_PUBLIC_SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Check the export
        run: |
          test -f out/index.html
          test -f out/resume.pdf
          if grep -rl "localhost:3000" out --include=*.html; then
            echo "::error::build output still points at localhost; link previews would break"
            exit 1
          fi
          grep -q "$NEXT_PUBLIC_SITE_URL" out/index.html

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          cname: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          commit_message: Deploy
