name: Deploy to GitHub Pages

# Pull requests build and check the static export; pushes to main also publish
# it to the gh-pages branch that GitHub Pages serves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Served from github.io/<repo>/ by default, or from the domain root once
      # the repository variable PAGES_CUSTOM_DOMAIN is set. Pull requests build
      # a preview served from <site>/preview/ that search engines skip.
      - name: Resolve site URL and base path
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            SITE_URL="https://$CUSTOM_DOMAIN"
            BASE_PATH=""
          else
            SITE_URL="https://$OWNER.github.io"
            BASE_PATH="/$REPO_NAME"
          fi
          if [ "$EVENT" = "pull_request" ]; then
            BASE_PATH="$BASE_PATH/preview"
            echo "NEXT_PUBLIC_NOINDEX=1" >> "$GITHUB_ENV"
          fi
          echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Check the export
        run: |
          test -f out/index.html
          test -f out/resume.pdf
          if grep -rl "localhost:3000" out --include=*.html; then
            echo "::error::build output still points at localhost; link previews would break"
            exit 1
          fi
          grep -q "$NEXT_PUBLIC_SITE_URL" out/index.html

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          cname: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          commit_message: Deploy

      # Same-repo pull requests publish their build to <site>/preview/ so the
      # change can be reviewed in a browser before merging. The next deploy
      # from main replaces the whole branch, which removes the preview.
      - name: Publish pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          destination_dir: preview
          keep_files: true
          commit_message: Preview
